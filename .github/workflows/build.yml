name: Build admin-server JAR

on:
  push:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      run_tests:
        description: '运行完整 Maven 测试'
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Cache Maven packages
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-maven-${{ hashFiles('pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-

      - name: Build or verify JAR
        run: |
          if [ "${{ inputs.run_tests }}" = "true" ]; then
            mvn -f pom.xml clean verify
          else
            mvn -f pom.xml clean package -DskipTests
          fi

      - name: Upload JAR as artifact
        uses: actions/upload-artifact@v4
        with:
          name: admin-server-jar
          path: target/film-forest-admin-*.jar
          retention-days: 5
