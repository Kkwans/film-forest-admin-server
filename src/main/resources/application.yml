server:
  port: 8081

spring:
  application:
    name: film-forest-admin
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${FILM_FOREST_DB_URL}
    username: ${FILM_FOREST_DB_USERNAME}
    password: ${FILM_FOREST_DB_PASSWORD}
    type: com.alibaba.druid.pool.DruidDataSource
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20
      max-wait: 60000
      time-between-eviction-runs-millis: 60000
      min-evictable-idle-time-millis: 300000
      max-evictable-idle-time-millis: 900000
      validation-query: SELECT 1
      test-while-idle: true
      test-on-borrow: false
      test-on-return: false
      keep-alive: true
      keep-alive-between-time-millis: 90000
      remove-abandoned: true
      remove-abandoned-timeout-millis: 300000
      log-abandoned: true
      filters: stat,wall
      connection-properties: druid.stat.mergeSql=true;druid.stat.slowSqlMillis=5000
  flyway:
    enabled: ${FILM_FOREST_FLYWAY_ENABLED:false}
    # Flyway 使用独立的原生 DataSource，避免 Druid 在权限探测失败后禁用迁移连接。
    url: ${FILM_FOREST_DB_URL}
    user: ${FILM_FOREST_DB_USERNAME}
    password: ${FILM_FOREST_DB_PASSWORD}
    baseline-on-migrate: true
    baseline-version: 1
    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.filmforest.content.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    com.filmforest: info
    com.filmforest.mapper: warn

jwt:
  secret: ${FILM_FOREST_ADMIN_JWT_SECRET}
  expiration: ${FILM_FOREST_ADMIN_JWT_EXPIRATION_MS:86400000}
  issuer: ${FILM_FOREST_ADMIN_JWT_ISSUER:film-forest-admin}

app:
  cors:
    allowed-origins: ${FILM_FOREST_ADMIN_CORS_ORIGINS:http://localhost:3001}
  crawler:
    http:
      connect-timeout: ${FILM_FOREST_CRAWLER_CONNECT_TIMEOUT:10s}
      request-timeout: ${FILM_FOREST_CRAWLER_REQUEST_TIMEOUT:20s}
      max-body-bytes: ${FILM_FOREST_CRAWLER_MAX_BODY_BYTES:10485760}
      max-attempts: ${FILM_FOREST_CRAWLER_MAX_ATTEMPTS:3}
      retry-base-delay: ${FILM_FOREST_CRAWLER_RETRY_BASE_DELAY:1s}
      proxy-enabled: ${FILM_FOREST_CRAWLER_PROXY_ENABLED:false}
      proxy-host: ${FILM_FOREST_CRAWLER_PROXY_HOST:127.0.0.1}
      proxy-port: ${FILM_FOREST_CRAWLER_PROXY_PORT:7890}
    execution:
      worker-concurrency: ${FILM_FOREST_CRAWLER_WORKERS:1}
      detail-concurrency: ${FILM_FOREST_CRAWLER_DETAIL_CONCURRENCY:1}
      queue-capacity: ${FILM_FOREST_CRAWLER_QUEUE_CAPACITY:4}
      heartbeat-interval-ms: ${FILM_FOREST_CRAWLER_HEARTBEAT_INTERVAL_MS:15000}
      stale-heartbeat-ms: ${FILM_FOREST_CRAWLER_STALE_HEARTBEAT_MS:120000}
      recovery-interval-ms: ${FILM_FOREST_CRAWLER_RECOVERY_INTERVAL_MS:60000}
      queue-dispatch-interval-ms: ${FILM_FOREST_CRAWLER_QUEUE_DISPATCH_INTERVAL_MS:5000}
      latest-consecutive-unchanged: ${FILM_FOREST_CRAWLER_LATEST_UNCHANGED_STOP:20}
      latest-recent-pages: ${FILM_FOREST_CRAWLER_LATEST_RECENT_PAGES:2}
